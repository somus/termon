name: Task
description: Track implementation, operations, or documentation work
title: "chore: "
labels:
  - task
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State what will be true when this task is complete.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List machine-checkable or operator-verifiable criteria.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and dependencies
      description: Include relevant TERM tickets, design contracts, or deployment prerequisites.
