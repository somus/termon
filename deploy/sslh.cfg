# Docker publishes public TCP ports 22 and 443 to these unprivileged listener
# ports. sslh forwards SSH to termond with a PROXY v1 header and TLS to
# Dokploy's Traefik container over the shared dokploy-network.
timeout: 2;
user: "sslh";

listen:
(
    { host: "0.0.0.0"; port: "22222"; max_connections: 1024; },
    { host: "0.0.0.0"; port: "8443"; max_connections: 1024; }
);

protocols:
(
    {
        name: "ssh";
        host: "termond";
        port: "2222";
        proxyprotocol: 1;
        keepalive: true;
        max_connections: 1024;
    },
    {
        name: "tls";
        host: "dokploy-traefik";
        port: "4443";
        keepalive: true;
        max_connections: 1024;
    }
);

# SSH clients wait for the server banner, so route unknown/quiet connections
# to SSH after the probe timeout.
on-timeout: "ssh";
