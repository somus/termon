# Docker publishes public TCP 22 to this unprivileged listener. sslh forwards
# SSH to termond with a PROXY v1 header so application logs retain the real
# client address while termond remains isolated from public networks.
timeout: 2;
user: "sslh";

listen:
(
    { host: "0.0.0.0"; port: "22222"; max_connections: 1024; }
);

protocols:
(
    {
        name: "ssh";
        host: "termond";
        port: "2222";
        proxyprotocol: 1;
        keepalive: true;
        max_connections: 1024;
    }
);

# SSH clients wait for the server banner, so route unknown/quiet connections
# to SSH after the probe timeout.
on-timeout: "ssh";
