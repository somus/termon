services:
  termond:
    # Production consumes the exact artifact built and scanned by release.yml.
    # Set the full name with an immutable digest; tags are not accepted by the
    # deployment contract documented in docs/deployment.md.
    image: ${TERMON_IMAGE:?set TERMON_IMAGE to ghcr.io/OWNER/IMAGE@sha256:DIGEST}
    restart: unless-stopped
    init: true
    command:
      - -content
      - /app/content
      - -database
      - /data/termon.db
      - -host-key
      - /data/host-key
      - -listen
      - 0.0.0.0:2222
      - -log-format
      - json
      - -website-listen
      - 0.0.0.0:8080
    environment:
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_LOGS_ENABLED: ${POSTHOG_LOGS_ENABLED:-false}
      TERMON_ENVIRONMENT: ${TERMON_ENVIRONMENT:-production}
    ports:
      - "${TERMON_PUBLIC_IP:?set TERMON_PUBLIC_IP to the VPS public IPv4 address}:22:2222"
    networks:
      - termon-ingress
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 512
    volumes:
      - termon-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  termon-data:
    name: termon-data

networks:
  # This dedicated bridge gives termond outbound telemetry access and lets
  # Docker publish SSH only on TERMON_PUBLIC_IP, leaving Tailscale untouched.
  termon-ingress:
